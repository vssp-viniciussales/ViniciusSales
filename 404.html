<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Página não encontrada · @vssp</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0E1B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fraunces:ital,wght@1,400&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --petroleo: #0E1B2C;
  --bege: #F2EDD8;
  --taupe: #C2B6AA;
  --ouro: #C8A97E;
  --ouro-dark: #A8855A;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--petroleo);
  color: var(--bege);
  font-family: 'Syne', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-align: center;
}

/* BG */
body::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(ellipse, rgba(200,169,126.06) 0%, transparent 65%);
  pointer-events: none;
}
.frame {
  position: absolute;
  inset: 24px;
  border: 1px solid rgba(200,169,126.08);
  pointer-events: none;
}

/* CONTEÚDO */
.content {
  position: relative;
  z-index: 1;
  animation: fadeUp .9s var(--ease) both;
}

.num-404 {
  font-family: 'Cinzel', serif;
  font-size: clamp(100px, 20vw, 180px);
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px rgba(200,169,126.2);
  line-height: 1;
  margin-bottom: -16px;
  letter-spacing: -4px;
  user-select: none;
}

.mono-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--ouro);
  opacity: .6;
  margin-bottom: 24px;
}

h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(22px, 4vw, 36px);
  font-weight: 900;
  color: var(--bege);
  margin-bottom: 16px;
  line-height: 1.2;
}

.tagline {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: clamp(15px, 2.5vw, 19px);
  color: rgba(242,237,216.45);
  margin-bottom: 48px;
  line-height: 1.7;
  max-width: 480px;
}

/* LINKS */
.actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px 28px;
  border-radius: 4px;
  text-decoration: none;
  transition: all .2s;
}
.btn-primary { background: var(--ouro); color: var(--petroleo); }
.btn-primary:hover { background: var(--ouro-dark); transform: translateY(-2px); }
.btn-outline {
  border: 1px solid rgba(200,169,126.3);
  color: rgba(242,237,216.6);
  background: none;
}
.btn-outline:hover { border-color: var(--ouro); color: var(--ouro); transform: translateY(-2px); }

/* LINKS RÁPIDOS */
.quick-links {
  margin-top: 56px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.quick-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(242,237,216.2);
  text-decoration: none;
  transition: color .2s;
}
.quick-link:hover { color: var(--ouro); }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(30px); }
  to   { opacity:1; transform:translateY(0); }
}

@media(max-width:480px) {
  .frame { inset:12px; }
  .actions { flex-direction:column; align-items:center; }
  .btn { width:200px; text-align:center; }
}
</style>
</head>
<body>

<div class="frame"></div>

<div class="content">
  <div class="num-404">404</div>
  <div class="mono-label">Página não encontrada</div>

  <h1>Este caminho não existe ainda.</h1>

  <p class="tagline">
    Mas a construção continua.<br>
    Volta para o início e segue junto.
  </p>

  <div class="actions">
    <a href="index.html" class="btn btn-primary">Ir para o início</a>
    <a href="link.html" class="btn btn-outline">Ver todos os links</a>
  </div>

  <div class="quick-links">
    <a href="historia.html" class="quick-link">História</a>
    <a href="negocios.html" class="quick-link">Negócios</a>
    <a href="blog.html" class="quick-link">Blog</a>
    <a href="consultoria.html" class="quick-link">Consultoria</a>
    <a href="https://instagram.com/vssp.viniciussales" target="_blank" class="quick-link">@vssp</a>
  </div>
</div>

</body>
</html>
