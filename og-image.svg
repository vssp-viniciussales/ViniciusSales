<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1B3A6B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0E1B2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A97E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8A97E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo base -->
  <rect width="1200" height="630" fill="#0E1B2C"/>

  <!-- Glow lateral esquerdo -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Borda frame -->
  <rect x="24" y="24" width="1152" height="582" rx="4" fill="none" stroke="#C8A97E" stroke-width="0.8" opacity="0.2"/>

  <!-- Linha horizontal ouro - divisor -->
  <rect x="60" y="320" width="300" height="1" fill="url(#line-grad)" opacity="0.5"/>

  <!-- Kicker -->
  <text x="60" y="140" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#C8A97E" opacity="0.65" text-transform="uppercase">PAULÍNIA, SP · BRASIL</text>

  <!-- Nome principal -->
  <text x="60" y="230" font-family="Georgia, serif" font-weight="700" font-size="80" fill="#F2EDD8" letter-spacing="2">Vinícius</text>
  <text x="60" y="315" font-family="Georgia, serif" font-weight="700" font-size="80" fill="#F2EDD8" letter-spacing="2" opacity="0.85">Padovani</text>

  <!-- Handle -->
  <text x="60" y="360" font-family="Courier New, monospace" font-size="16" letter-spacing="4" fill="#C8A97E" opacity="0.7">@vssp.viniciussales</text>

  <!-- Manifesto -->
  <text x="60" y="420" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#F2EDD8" opacity="0.55">Não sou o homem que chegou lá.</text>
  <text x="60" y="455" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#C8A97E">Sou o homem chegando.</text>

  <!-- Tags -->
  <text x="60" y="520" font-family="Courier New, monospace" font-size="13" letter-spacing="3" fill="#C2B6AA" opacity="0.45">Fé · Família · Negócios · Corpo · Legado</text>

  <!-- VSSP grande ao fundo (decorativo) -->
  <text x="680" y="520" font-family="Georgia, serif" font-weight="700" font-size="260" fill="#C8A97E" opacity="0.04" letter-spacing="-8">VS</text>
</svg>
